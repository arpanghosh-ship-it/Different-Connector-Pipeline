# Local development:
#   docker compose build
#   docker compose up -d
#   docker compose logs -f
#   docker compose down

version: "3.9"

services:
  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      RAG_PIPELINE_URL: http://rag-pipeline:8001
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    networks:
      - app-network
    # restart: unless-stopped

  rag-pipeline:
    build: ./rag_pipeline
    container_name: rag-pipeline
    ports:
      - "8001:8001"
    env_file:
      - ./rag_pipeline/.env
    environment:
      STORAGE_BASE_PATH: /app/storage
    volumes:
      - storage_data:/app/storage
    depends_on:
      - backend
    networks:
      - app-network
    # restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: rag-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
      - rag-pipeline
    networks:
      - app-network
    # restart: unless-stopped

volumes:
  storage_data:

networks:
  app-network:
    driver: bridge
